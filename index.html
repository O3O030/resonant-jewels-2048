      (function() {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') || Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), 'fetch');
          if (desc && !desc.set && desc.configurable) {
            var originalFetch = window.fetch;
            var customFetch = null;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return customFetch || originalFetch || (desc.get ? desc.get.call(window) : undefined);
              },
              set: function(val) {
                customFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // ignore error
        }
      })();
    </script>
